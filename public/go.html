<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kinvo study</title>
<style>
  body { margin: 0; padding: 32px 20px; font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #1f2a2e; background: #f6efe4; }
  main { max-width: 420px; margin: 0 auto; }
  a { display: block; margin-top: 16px; padding: 14px; border-radius: 12px; text-align: center; color: #fff; background: #1f5c66; text-decoration: none; }
</style>
</head>
<body>
<main>
  <p>Opening the study...</p>
  <a id="open" href="#">Open the study</a>
</main>
<script>
  // Iter2.05 A/B entry link. /go and /go/assign are the only Kinvo paths outside the login gate (Caddy on zanux),
  // so this page must stay self-contained. Keep the links in step with src/app/StudyRedirect.tsx.
  // A new visitor gets the version the server has given out less often (POST /go/assign), so A and B stay
  // within one of each other. If the server does not answer in 3 s, the pick is random.
  // ?v=a or ?v=b forces a version for pilots and tests. It is not counted and not remembered.
  // Otherwise the first version sticks to this browser and is counted once.
  var LINKS = { a: 'https://t.maze.co/603496315', b: 'https://t.maze.co/603503575' };
  var KEY = 'kinvo.study.v1';

  function isVersion(v) { return v === 'a' || v === 'b'; }

  function go(version) {
    document.getElementById('open').href = LINKS[version];
    location.replace(LINKS[version]);
  }

  function remember(version) {
    try { localStorage.setItem(KEY, version); } catch (e) {}
    go(version);
  }

  var forced = new URLSearchParams(location.search).get('v');
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}

  if (isVersion(forced)) {
    go(forced);
  } else if (isVersion(saved)) {
    go(saved);
  } else {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 3000);
    fetch('/go/assign', { method: 'POST', cache: 'no-store', signal: ctrl.signal })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (body) {
        clearTimeout(timer);
        remember(body && isVersion(body.version) ? body.version : Math.random() < 0.5 ? 'a' : 'b');
      })
      .catch(function () {
        remember(Math.random() < 0.5 ? 'a' : 'b');
      });
  }
</script>
</body>
</html>
